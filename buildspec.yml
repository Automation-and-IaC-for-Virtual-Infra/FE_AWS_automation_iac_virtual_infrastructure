version: 0.1

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Building Next.js app..."
      - npm run build
      - npm run export || echo "No export needed"
  post_build:
    commands:
      - echo "Zipping build output..."
      - zip -r build.zip .next package.json node_modules public next.config.js
artifacts:
  files:
    - build.zip
